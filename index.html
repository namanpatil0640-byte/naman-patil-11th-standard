<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naman Patil 11th Standard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #111827;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 22px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin-bottom: 0;
    }

    nav {
      background: white;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px #0002;
    }

    nav button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 10px #0001;
    }

    .card h2 {
      color: #2563eb;
    }

    .question {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .question button {
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      cursor: pointer;
    }

    .question button:hover {
      background: #dbeafe;
    }

    .answer {
      color: green;
      font-weight: bold;
      display: none;
    }

    footer {
      text-align: center;
      background: #1e293b;
      color: white;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Naman Patil 11th Standard</h1>
    <p>Maharashtra Board Study Website</p>
  </header>

  <nav>
    <button onclick="showSubject('Chemistry')">Chemistry</button>
    <button onclick="showSubject('Mathematics')">Mathematics</button>
    <button onclick="showSubject('Physics')">Physics</button>
    <button onclick="showSubject('Biology')">Biology</button>
  </nav>

  <main id="content">
    <div class="card">
      <h2>Welcome Students</h2>
      <p>Choose a subject from the menu to practice MCQ questions.</p>
    </div>
  </main>

  <footer>
    © 2026 Naman Patil 11th Standard
  </footer>

  <script>
    const papers = {
      Chemistry: [
        {
          q: "What is the SI unit of amount of substance?",
          options: ["Gram", "Mole", "Litre", "Kilogram"],
          answer: 1
        },
        {
          q: "What is Avogadro's number?",
          options: [
            "6.022 × 10²³",
            "3.011 × 10²³",
            "9.8 × 10²³",
            "1.602 × 10⁻¹⁹"
          ],
          answer: 0
        },
        {
          q: "What is the molar mass of water?",
          options: ["16 g/mol", "17 g/mol", "18 g/mol", "20 g/mol"],
          answer: 2
        },
        {
          q: "Which particle has a negative charge?",
          options: ["Proton", "Neutron", "Electron", "Nucleus"],
          answer: 2
        },
        {
          q: "What is the atomic number of hydrogen?",
          options: ["1", "2", "8", "12"],
          answer: 0
        },
        {
          q: "What is the molecular mass of CO₂?",
          options: ["28 u", "32 u", "44 u", "48 u"],
          answer: 2
        },
        {
          q: "The law of definite proportions was proposed by:",
          options: ["Dalton", "Proust", "Avogadro", "Boyle"],
          answer: 1
        },
        {
          q: "One mole contains how many particles?",
          options: [
            "6.022 × 10²³",
            "6.022 × 10²²",
            "3.011 × 10²³",
            "1.602 × 10⁻¹⁹"
          ],
          answer: 0
        },
        {
          q: "The empirical formula of benzene is:",
          options: ["CH", "CH₂", "C₂H₂", "C₆H₆"],
          answer: 0
        },
        {
          q: "The SI unit of temperature is:",
          options: ["Celsius", "Fahrenheit", "Kelvin", "Joule"],
          answer: 2
        }
      ],

      Mathematics: [
        {
          q: "What is the value of 5²?",
          options: ["10", "15", "20", "25"],
          answer: 3
        },
        {
          q: "What is the derivative of x²?",
          options: ["x", "2x", "x²", "2"],
          answer: 1
        },
        {
          q: "What is the value of sin 90°?",
          options: ["0", "1", "-1", "1/2"],
          answer: 1
        },
        {
          q: "What is the value of cos 0°?",
          options: ["0", "1", "-1", "1/2"],
          answer: 1
        },
        {
          q: "The slope of a horizontal line is:",
          options: ["1", "0", "Undefined", "-1"],
          answer: 1
        },
        {
          q: "The square root of 144 is:",
          options: ["10", "11", "12", "14"],
          answer: 2
        },
        {
          q: "What is the value of 2³?",
          options: ["6", "8", "9", "12"],
          answer: 1
        },
        {
          q: "The sum of angles of a triangle is:",
          options: ["90°", "180°", "270°", "360°"],
          answer: 1
        },
        {
          q: "The value of log₁₀100 is:",
          options: ["1", "2", "10", "100"],
          answer: 1
        },
        {
          q: "What is the value of 10 × 10?",
          options: ["10", "20", "100", "1000"],
          answer: 2
        }
      ],

      Physics: [
        {
          q: "What is the SI unit of force?",
          options: ["Watt", "Joule", "Newton", "Pascal"],
          answer: 2
        },
        {
          q: "What is the SI unit of electric current?",
          options: ["Volt", "Ampere", "Ohm", "Joule"],
          answer: 1
        }
      ],

      Biology: [
        {
          q: "Which organelle is called the powerhouse of the cell?",
          options: ["Nucleus", "Ribosome", "Mitochondria", "Golgi body"],
          answer: 2
        },
        {
          q: "What is the basic unit of life?",
          options: ["Tissue", "Cell", "Organ", "Organ system"],
          answer: 1
        }
      ]
    };

    function showSubject(subject) {
      const content = document.getElementById("content");

      let html = `
        <div class="card">
          <h2>${subject} Questions</h2>
          <p>Choose the correct answer.</p>
      `;

      papers[subject].forEach((item, index) => {
        html += `
          <div class="question">
            <b>${index + 1}. ${item.q}</b>
        `;

        item.options.forEach((option, optionIndex) => {
          html += `
            <button onclick="checkAnswer(this, ${optionIndex}, ${item.answer})">
              ${String.fromCharCode(65 + optionIndex)}. ${option}
            </button>
          `;
        });

        html += `
            <p class="answer"></p>
          </div>
        `;
      });

      html += `</div>`;
      content.innerHTML = html;
    }

    function checkAnswer(button, selected, correct) {
      const question = button.parentElement;
      const answerText = question.querySelector(".answer");

      if (selected === correct) {
        answerText.textContent = "Correct answer!";
        answerText.style.color = "green";
      } else {
        answerText.textContent = "Wrong answer. Try again!";
        answerText.style.color = "red";
      }

      answerText.style.display = "block";
    }
  </script>

</body>
</html>
